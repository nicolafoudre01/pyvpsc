[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyvpsc"
version = "0.2.0"
description = "Viscoplastic self-consistent polycrystal model (strain-rate driven), built on pyhom"
requires-python = ">=3.9"
dependencies = ["numpy", "pyhom"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
